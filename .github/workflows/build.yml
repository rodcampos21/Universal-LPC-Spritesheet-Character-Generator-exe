name: Build LPC Sprite Gerador (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publicar um release com o .exe"
        type: boolean
        default: false
      version:
        description: "Tag do release (ex.: v0.1.0)"
        type: string
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas
        run: python -m pip install --upgrade pip pyinstaller numpy pillow

      - name: Testes
        run: python -W ignore -m unittest discover -s tests -v

      - name: Teste com a arte de verdade (baixa do GitHub)
        run: python tools/real_art_check.py

      - name: Gerar LPCSpriteGerador.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name LPCSpriteGerador
          --paths .
          --add-data "lpcgen/web;lpcgen/web"
          --add-data "lpcgen/custom_anims.json;lpcgen"
          lpcgen/launch.py

      - name: Teste do .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\LPCSpriteGerador.exe -ArgumentList "--no-browser","--port","8766","--home","$env:RUNNER_TEMP\lpc-home" -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 1
            try { $s = Invoke-RestMethod -Uri http://127.0.0.1:8766/api/status -TimeoutSec 5; $ok = $true; break } catch { }
          }
          if (-not $ok) { Write-Output "::error title=exe::o servidor não respondeu"; exit 1 }
          $page = Invoke-WebRequest -Uri http://127.0.0.1:8766/ -UseBasicParsing
          if ($page.Content -notmatch "LPC Sprite Gerador") { Write-Output "::error title=exe::página ausente"; exit 1 }
          $js = Invoke-WebRequest -Uri http://127.0.0.1:8766/static/app.js -UseBasicParsing
          if ($js.StatusCode -ne 200) { exit 1 }
          Stop-Process -Id $p.Id -Force
          $mb = [math]::Round((Get-Item dist\LPCSpriteGerador.exe).Length / 1MB, 1)
          Write-Output "::notice title=tamanho::$mb MB"

      - uses: actions/upload-artifact@v4
        with:
          name: LPCSpriteGerador
          path: dist/LPCSpriteGerador.exe

      - name: Publicar release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.version }}"
          if ("${{ github.ref }}".StartsWith("refs/tags/")) { $tag = "${{ github.ref_name }}" }
          $notes = "Baixe LPCSpriteGerador.exe e dê dois cliques. Na primeira vez ele baixa a arte do LPC (~400 MB). Veja o README."
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/LPCSpriteGerador.exe --clobber
          } else {
            gh release create $tag dist/LPCSpriteGerador.exe --title "LPC Sprite Gerador $tag" --notes $notes --prerelease --target $env:GITHUB_SHA
          }
